<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GAMBO</title>

  <link
    rel="preload"
    as="image"
    href="./assets/Loading%20Page/GAMBO%20word.png"
    fetchpriority="high"
  />
  <link
    rel="icon"
    type="image/png"
    href="./assets/Loading%20Page/GAMBO%20word.png"
  />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JQ4FQ7SHNR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "G-JQ4FQ7SHNR");
  </script>

  <style>
    :root {
      --vh: 1vh;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    #c {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #000;
    }

    body.ios #loader {
      height: calc(var(--vh) * 100);
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    body.ios .loader-inner {
      transform: translateY(-6%);
    }

    .loader-logo-wrap {
      width: min(70vw, 520px);
    }

    body.ios .loader-logo-wrap {
      width: min(75vw, 340px);
    }

    .loader-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    #loader-status {
      margin-top: 18px;
      min-height: 18px;
      color: #fff;
      font-family: monospace;
      font-size: 18px;
      line-height: 1;
      text-align: center;
      user-select: none;
      opacity: 0.9;
      letter-spacing: 0.08em;
    }

    body.ios #loader-status {
      margin-top: 16px;
      font-size: 17px;
    }

    #loader-status.is-enter-ready {
      animation: loaderEnterPulse 2.6s ease-in-out infinite;
      letter-spacing: 0.06em;
    }

    @keyframes loaderEnterPulse {
      0%, 100% {
        opacity: 0.75;
        transform: translateY(0) scale(1);
        text-shadow:
          0 0 3px rgba(255, 255, 255, 0.10),
          0 0 8px rgba(255, 255, 255, 0.04);
      }

      50% {
        opacity: 0.95;
        transform: translateY(-1px) scale(1.025);
        text-shadow:
          0 0 6px rgba(255, 255, 255, 0.22),
          0 0 14px rgba(255, 255, 255, 0.10);
      }
    }
  </style>
</head>

<body>
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-logo-wrap">
        <img
          class="loader-logo"
          src="./assets/Loading%20Page/GAMBO%20word.png"
          alt="GAMBO"
          fetchpriority="high"
        />

        <!-- Kept for compatibility with the loading code in main.js. -->
        <div class="logo-fill-mask" hidden aria-hidden="true"></div>
      </div>

      <div id="loader-status">0%</div>
    </div>
  </div>

  <canvas id="c"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script>
    function isIOS() {
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      );
    }

    if (isIOS()) {
      document.body.classList.add("ios");
    }

    function setVH() {
      const height = window.visualViewport
        ? window.visualViewport.height
        : window.innerHeight;

      document.documentElement.style.setProperty("--vh", `${height * 0.01}px`);
    }

    setVH();
    window.addEventListener("resize", setVH);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", setVH);
      window.visualViewport.addEventListener("scroll", setVH);
    }

    setTimeout(setVH, 150);
    setTimeout(setVH, 600);
  </script>

  <script type="module" src="./main.js?v=DEV125"></script>
</body>
</html>
